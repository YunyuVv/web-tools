<!doctype html>
<html lang="zh-CN" class="theme-light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>主题色 Demo · DevToolBox</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;

    /* 基础中性 token（跟随明暗，不随主题色变） */
    --card-foreground: oklch(0.14 0 0);
    --muted-foreground: oklch(0.55 0 0);
    --border: oklch(0.90 0 0);
    --secondary: oklch(0.97 0 0);
  }
  .theme-light {
    --background: oklch(1 0 0);
    --foreground: oklch(0.14 0 0);
    --card: oklch(1 0 0);
    --card-foreground: oklch(0.14 0 0);
    --muted-foreground: oklch(0.52 0 0);
    --border: oklch(0.90 0 0);
    --secondary: oklch(0.97 0 0);
  }
  .theme-dark {
    --background: var(--bg-dark, oklch(0.13 0.004 175));
    --foreground: oklch(0.97 0 0);
    --card: oklch(0.17 0.004 175);
    --card-foreground: oklch(0.97 0 0);
    --muted-foreground: oklch(0.65 0 0);
    --border: oklch(1 0 0 / 12%);
    --secondary: oklch(0.23 0.004 175);
  }

  /* 主题色 token（由 JS 按 hue 注入） */
  :root {
    --primary: oklch(0.60 0.13 175);
    --primary-foreground: oklch(0.99 0 0);
    --ring: oklch(0.60 0.13 175);
    --accent: oklch(0.95 0.02 175);
    --accent-foreground: oklch(0.20 0 0);
    --chart-1: oklch(0.60 0.13 175);
    --shine: oklch(0.58 0.16 175);
    --bg-dark: oklch(0.13 0.004 175);
    --card-dark: oklch(0.17 0.004 175);
    --secondary-dark: oklch(0.23 0.004 175);
    --accent-dark: oklch(0.24 0.01 175);
    --primary-dark: oklch(0.70 0.12 175);
  }

  body {
    margin: 0;
    font-family: var(--font);
    background: var(--background);
    color: var(--foreground);
    transition: background .35s ease, color .35s ease;
  }

  /* ── 顶部控制条 ── */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    backdrop-filter: blur(12px);
    background: color-mix(in oklch, var(--background) 80%, transparent);
    border-bottom: 1px solid var(--border);
    padding: 14px 22px;
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
  }
  .topbar h2 { font-size: 15px; margin: 0; font-weight: 700; }
  .topbar .hint { font-size: 12px; color: var(--muted-foreground); }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
  .swatch {
    width: 30px; height: 30px; border-radius: 9px; cursor: pointer;
    border: 2px solid transparent; position: relative;
    transition: transform .12s ease;
  }
  .swatch:hover { transform: scale(1.08); }
  .swatch.active { border-color: var(--foreground); box-shadow: 0 0 0 2px var(--background), 0 0 0 4px var(--ring); }
  .swatch .name {
    position: absolute; top: 36px; left: 50%; transform: translateX(-50%);
    font-size: 11px; white-space: nowrap; color: var(--muted-foreground);
    opacity: 0; transition: opacity .15s ease; pointer-events: none;
  }
  .swatch:hover .name, .swatch.active .name { opacity: 1; }

  .toggle {
    display: inline-flex; padding: 3px; border-radius: 999px;
    background: var(--secondary); border: 1px solid var(--border);
  }
  .toggle button {
    border: 0; background: transparent; color: var(--muted-foreground);
    font-size: 13px; padding: 6px 14px; border-radius: 999px; cursor: pointer;
    font-family: var(--font);
  }
  .toggle button.active { background: var(--primary); color: var(--primary-foreground); font-weight: 600; }

  /* ── 预览舞台 ── */
  .stage {
    display: grid; grid-template-columns: 248px 1fr; min-height: calc(100vh - 64px);
  }
  @media (max-width: 820px) { .stage { grid-template-columns: 1fr; } .sidebar { display: none; } }

  /* 侧栏 */
  .sidebar {
    border-right: 1px solid var(--border);
    padding: 20px 14px; background: color-mix(in oklch, var(--background) 96%, var(--card-dark));
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 6px 8px 18px; }
  .brand .logo {
    width: 30px; height: 30px; color: var(--primary);
  }
  .brand .logo svg { width: 100%; height: 100%; }
  .brand .title { font-weight: 800; font-size: 16px; letter-spacing: -.01em; }
  .navgroup { font-size: 11px; color: var(--muted-foreground); text-transform: uppercase; letter-spacing: .06em; padding: 14px 8px 6px; }
  .navitem {
    display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 10px;
    font-size: 14px; color: var(--card-foreground); cursor: pointer; margin-bottom: 2px;
  }
  .navitem:hover { background: var(--accent); }
  .navitem.active { background: color-mix(in oklch, var(--primary) 14%, transparent); color: var(--primary); font-weight: 600; }
  .navitem .ico { width: 16px; height: 16px; }

  /* 主区域 */
  .main { position: relative; }
  .hero {
    min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 60px 24px; gap: 18px;
  }
  .hero h1 {
    font-size: clamp(34px, 6vw, 64px); font-weight: 800; letter-spacing: -.02em; margin: 0;
    display: flex; align-items: center; gap: 14px;
  }
  /* ShinyText 还原 */
  .shiny {
    --base: var(--foreground);
    --sh: var(--shine);
    background: linear-gradient(115deg, var(--base) 40%, var(--sh) 47%, var(--sh) 53%, var(--base) 60%);
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    display: inline-block; animation: sweep 3s linear infinite;
  }
  .theme-dark .shiny { --base: color-mix(in oklch, var(--foreground) 72%, transparent); --sh: var(--primary); }
  .shiny .emoji { -webkit-text-fill-color: initial; color: initial; }
  @keyframes sweep { 0% { background-position: 100% center; } 100% { background-position: -100% center; } }
  .hero p.sub { color: var(--muted-foreground); font-size: 16px; max-width: 460px; margin: 0; }

  /* 搜索框 */
  .search {
    width: min(560px, 92%); margin-top: 8px;
    display: flex; align-items: center; gap: 12px;
    height: 52px; padding: 0 18px; border-radius: 16px;
    background: var(--card); border: 1px solid color-mix(in oklch, var(--border) 70%, var(--primary) 0%);
    box-shadow: 0 1px 2px rgb(0 0 0 / 6%);
    transition: box-shadow .2s ease, border-color .2s ease;
  }
  .search:focus-within {
    border-color: var(--ring);
    box-shadow: 0 0 0 3px color-mix(in oklch, var(--primary) 18%, transparent), 0 8px 24px color-mix(in oklch, var(--primary) 12%, transparent);
  }
  .search svg { width: 18px; height: 18px; color: var(--muted-foreground); flex: none; }
  .search input {
    flex: 1; border: 0; background: transparent; outline: none; font-size: 16px;
    color: var(--foreground); font-family: var(--font);
  }
  .search input::placeholder { color: color-mix(in oklch, var(--foreground) 40%, transparent); }
  .search .kbd {
    font-size: 12px; color: var(--muted-foreground); border: 1px solid var(--border);
    border-radius: 6px; padding: 2px 7px; background: var(--secondary);
  }

  /* 工具卡网格 */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; width: min(760px, 94%); margin-top: 6px; }
  .card {
    position: relative; padding: 16px; border-radius: 16px; background: var(--card);
    border: 1px solid var(--border); text-align: left; cursor: pointer; overflow: hidden;
    transition: border-color .2s ease, transform .2s ease;
  }
  .card:hover { transform: translateY(-2px); border-color: color-mix(in oklch, var(--primary) 40%, var(--border)); }
  .card .glow {
    position: absolute; width: 240px; height: 240px; border-radius: 50%;
    background: radial-gradient(circle, color-mix(in oklch, var(--primary) 22%, transparent), transparent 70%);
    opacity: 0; transition: opacity .25s ease; pointer-events: none; transform: translate(-50%, -50%);
  }
  .card:hover .glow { opacity: 1; }
  .card .cico {
    width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    background: color-mix(in oklch, var(--primary) 14%, transparent); color: var(--primary); margin-bottom: 10px;
  }
  .card .cico svg { width: 18px; height: 18px; }
  .card .ctitle { font-weight: 700; font-size: 14px; }
  .card .cdesc { font-size: 12px; color: var(--muted-foreground); margin-top: 3px; }

  /* 主按钮示例 */
  .btns { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
  .btn { border: 0; border-radius: 12px; padding: 11px 20px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: var(--font); }
  .btn-primary { background: var(--primary); color: var(--primary-foreground); }
  .btn-ghost { background: var(--accent); color: var(--accent-foreground); }
  .btn-outline { background: transparent; color: var(--primary); border: 1px solid var(--ring); }

  .meta { margin-top: 26px; font-size: 12px; color: var(--muted-foreground); }
  .meta code { background: var(--secondary); padding: 2px 7px; border-radius: 6px; font-size: 12px; }
</style>
</head>
<body>
  <div class="topbar">
    <h2>主题色 Demo</h2>
    <span class="hint">点击色块切换主题色 · 右侧切换明暗</span>
    <div class="toggle">
      <button id="lightBtn" class="active" onclick="setMode('light')">☀ 明亮</button>
      <button id="darkBtn" onclick="setMode('dark')">🌙 暗黑</button>
    </div>
    <div class="swatches" id="swatches"></div>
  </div>

  <div class="stage">
    <!-- 侧栏 -->
    <aside class="sidebar">
      <div class="brand">
        <span class="logo">
          <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M13.5 2.5 4 5l-1.5 4 11 .5L17 6z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
            <path d="M3.4 10.5 14.5 11l1 4.4-9.6.9z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
            <text x="9.7" y="13.2" font-size="3" font-weight="900" text-anchor="middle" fill="currentColor">tools</text>
          </svg>
        </span>
        <span class="title">DevToolBox</span>
      </div>
      <div class="navgroup">常用</div>
      <div class="navitem active"><span class="ico">📝</span> JSON 格式化</div>
      <div class="navitem"><span class="ico">🔤</span> Base64 编码</div>
      <div class="navitem"><span class="ico">🔗</span> URL 编码</div>
      <div class="navgroup">编解码</div>
      <div class="navitem"><span class="ico">🕒</span> 时间戳转换</div>
      <div class="navitem"><span class="ico">🎨</span> 颜色转换</div>
      <div class="navitem"><span class="ico">🧩</span> 正则测试</div>
    </aside>

    <!-- 主区域 -->
    <main class="main">
      <div class="hero">
        <h1><span class="shiny"><span class="emoji">✨</span> 开发者工具箱</span></h1>
        <p class="sub">快速、免费的在线开发工具，无需安装。输入关键词即可查找你需要的工具。</p>
        <div class="search">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input placeholder="搜索工具…" />
          <span class="kbd">⌘K</span>
        </div>
        <div class="cards">
          <div class="card"><span class="glow"></span><div class="cico">📝</div><div class="ctitle">JSON 格式化</div><div class="cdesc">美化 / 压缩 / 校验</div></div>
          <div class="card"><span class="glow"></span><div class="cico">🔤</div><div class="ctitle">Base64 编码</div><div class="cdesc">编码 / 解码文本</div></div>
          <div class="card"><span class="glow"></span><div class="cico">🔗</div><div class="ctitle">URL 编码</div><div class="cdesc">编码 / 解码 URL</div></div>
          <div class="card"><span class="glow"></span><div class="cico">🕒</div><div class="ctitle">时间戳转换</div><div class="cdesc">日期 ↔ 时间戳</div></div>
        </div>
        <div class="btns">
          <button class="btn btn-primary">主要操作</button>
          <button class="btn btn-ghost">次要操作</button>
          <button class="btn btn-outline">描边按钮</button>
        </div>
        <div class="meta">当前主色 <code id="metaPrimary">oklch(0.55 0.13 175)</code> · 扫光色 <code id="metaShine">oklch(0.50 0.16 175)</code></div>
      </div>
    </main>
  </div>

<script>
  // 主题定义：与项目一致，仅改变 hue，明度/彩度保持不变（apples-to-apples 对比）
  const THEMES = [
    { name: '薄荷绿', h: 175, cur: true },
    { name: '蓝',     h: 245 },
    { name: '靛',     h: 265 },
    { name: '紫',     h: 290 },
    { name: '玫红',   h: 330 },
    { name: '红',     h: 12  },
    { name: '橙',     h: 45  },
    { name: '琥珀',   h: 75  },
    { name: '翠绿',   h: 150 },
    { name: '青蓝',   h: 205 },
  ];

  const root = document.documentElement;
  let currentMode = 'light';
  let currentTheme = THEMES[0];

  // 根据 hue 计算 亮/暗 两套主题色 token（与项目保持一致结构）
  function applyTheme(t, mode) {
    const h = t.h;
    const primaryL = `oklch(0.60 0.13 ${h})`;
    const accentL  = `oklch(0.95 0.02 ${h})`;
    const shineL   = `oklch(0.58 0.16 ${h})`;
    const primaryD = `oklch(0.70 0.12 ${h})`;
    const accentD  = `oklch(0.24 0.01 ${h})`;
    const bgD      = `oklch(0.13 0.004 ${h})`;
    const cardD    = `oklch(0.17 0.004 ${h})`;
    const secD     = `oklch(0.23 0.004 ${h})`;

    if (mode === 'dark') {
      root.style.setProperty('--primary', primaryD);
      root.style.setProperty('--ring', primaryD);
      root.style.setProperty('--accent', accentD);
      root.style.setProperty('--chart-1', primaryD);
      root.style.setProperty('--card', cardD);
      root.style.setProperty('--secondary', secD);
      root.style.setProperty('--bg-dark', bgD);
    } else {
      root.style.setProperty('--primary', primaryL);
      root.style.setProperty('--ring', primaryL);
      root.style.setProperty('--accent', accentL);
      root.style.setProperty('--chart-1', primaryL);
      root.style.setProperty('--card', 'oklch(1 0 0)');
      root.style.setProperty('--secondary', 'oklch(0.97 0 0)');
    }
    // 暗色专用变体
    root.style.setProperty('--primary-dark', primaryD);
    root.style.setProperty('--accent-dark', accentD);
    root.style.setProperty('--card-dark', cardD);
    root.style.setProperty('--secondary-dark', secD);
    root.style.setProperty('--bg-dark', bgD);
    root.style.setProperty('--shine', mode === 'dark' ? primaryD : shineL);
    document.getElementById('metaPrimary').textContent = (mode === 'dark' ? primaryD : primaryL);
    document.getElementById('metaShine').textContent = (mode === 'dark' ? primaryD : shineL);
  }

  function setMode(mode) {
    currentMode = mode;
    root.className = 'theme-' + mode;
    document.getElementById('lightBtn').classList.toggle('active', mode === 'light');
    document.getElementById('darkBtn').classList.toggle('active', mode === 'dark');
    applyTheme(currentTheme, mode);
  }

  function buildSwatches() {
    const wrap = document.getElementById('swatches');
    THEMES.forEach((t) => {
      const sw = document.createElement('div');
      sw.className = 'swatch' + (t.cur ? ' active' : '');
      sw.style.background = `oklch(0.62 0.15 ${t.h})`;
      sw.innerHTML = `<span class="name">${t.name}</span>`;
      sw.onclick = () => {
        document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
        sw.classList.add('active');
        currentTheme = t;
        applyTheme(t, currentMode);
      };
      wrap.appendChild(sw);
    });
  }

  function init() {
    buildSwatches();
    applyTheme(currentTheme, currentMode);
  }
  init();
</script>
</body>
</html>
