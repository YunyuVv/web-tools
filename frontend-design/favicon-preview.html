<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Favicon 预览 · 透明背景 vs 旧版白底</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 40px;
    background: #f5f5f5;
    color: #111;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { margin: 0 0 28px; color: #666; font-size: 14px; }
  .grid { display: flex; gap: 40px; flex-wrap: wrap; }
  .col { background: #fff; border: 1px solid #e5e5e5; border-radius: 16px; padding: 24px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .col.dark { background: #1e1e1e; border-color: #333; color: #eee; }
  .col h2 { font-size: 14px; margin: 0 0 18px; font-weight: 600; letter-spacing: .02em; }
  .row { display: flex; align-items: center; gap: 18px; margin-bottom: 22px; }
  .row:last-child { margin-bottom: 0; }
  .label { font-size: 13px; color: #888; width: 92px; }
  .col.dark .label { color: #999; }
  .chip { width: 64px; height: 64px; border-radius: 14px; display: grid; place-items: center; background: #fafafa; }
  .chip.dark { background: #2a2a2a; }
  .chip.tab { width: auto; padding: 8px 14px; border-radius: 10px; font-size: 13px; color: #555; }
  .chip.tab.dark { color: #bbb; }
  .chip svg { width: 40px; height: 40px; display: block; }
  /* 模拟浏览器标签 */
  .tabbar { display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px; background: #fff; border: 1px solid #e5e5e5; }
  .tabbar.dark { background: #2a2a2a; border-color: #3a3a3a; }
  .tabbar .fav { width: 16px; height: 16px; }
  .tabbar .fav svg { width: 16px; height: 16px; display: block; }
  .tabbar .t { font-size: 13px; color: #444; }
  .tabbar.dark .t { color: #ccc; }
</style>
</head>

      </div>
      <div class="row">
        <span class="label">标签栏</span>

      </div>
    </div>
